<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>TORTOPANI — тимчасово недоступний</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #F9F9F5;
      --ink: #16190F;
      --ink-soft: #4E5445;
      --green: #2E7D4F;
      --green-dark: #215F3C;
      --green-50: #F1F8F2;
      --mint: #BFE6C7;
      --serif: "Lora", Georgia, "Times New Roman", serif;
      --sans: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, var(--mint) 0%, transparent 55%),
        linear-gradient(180deg, var(--green-50) 0%, var(--cream) 45%, var(--cream) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(28rem, 100%);
      text-align: center;
    }

    .logo {
      display: inline-block;
      margin-bottom: 2rem;
    }

    .logo img {
      height: 2.25rem;
      width: auto;
    }

    h1 {
      font-family: var(--serif);
      font-weight: 600;
      font-size: clamp(1.5rem, 4.5vw, 1.85rem);
      line-height: 1.25;
      letter-spacing: -0.01em;
      color: var(--green-dark);
      margin-bottom: 0.85rem;
    }

    p {
      font-size: 1rem;
      line-height: 1.55;
      color: var(--ink-soft);
      margin-bottom: 0.65rem;
    }

    .en {
      font-size: 0.875rem;
      opacity: 0.85;
      margin-bottom: 1.75rem;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 2.75rem;
      padding: 0.7rem 1.35rem;
      border-radius: 999px;
      background: var(--green);
      color: #fff;
      font-weight: 600;
      font-size: 0.9375rem;
      text-decoration: none;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .cta:hover {
      background: var(--green-dark);
    }

    .cta:active {
      transform: scale(0.98);
    }

    .cta:focus-visible {
      outline: 2px solid var(--green-dark);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <a class="logo" href="https://t.me/tortopamiinsade" aria-label="TORTOPANI">
      <img src="assets/logo_hor.png" alt="TORTOPANI" width="180" height="36" />
    </a>
    <h1>Сайт тимчасово недоступний</h1>
    <p>Оновлюємо вітрину. Напиши нам у&nbsp;Telegram — відповімо там.</p>
    <p class="en" lang="en">We’re updating the storefront. Reach us on Telegram for now.</p>
    <a class="cta" href="https://t.me/tortopamiinsade" target="_blank" rel="noopener noreferrer">
      Написати в Telegram
    </a>
  </main>
</body>
</html>
